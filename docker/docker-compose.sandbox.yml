version: '3.8'

services:
  asura-sandbox:
    build:
      context: ..
      dockerfile: docker/Dockerfile.sandbox
    container_name: asura-sandbox
    restart: unless-stopped
    environment:
      - DISPLAY=:99
      - RESOLUTION=1280x800x24
    ports:
      - "5900:5900"   # VNC Direct
      - "6080:6080"   # noVNC Web Browser GUI
      - "5555:5555"   # ADB Bridge for mobile testing
    shm_size: '1gb'
    security_opt:
      - no-new-privileges:true
