<!-- Widget: Intelligence Monitor -->
<div class="bg-white border border-zinc-200 rounded-2xl overflow-hidden shadow-sm flex flex-col w-full">
    <div class="p-6 border-b border-zinc-100 flex justify-between items-center bg-zinc-50/30">
        <div>
            <h3 class="font-bold text-zinc-900 tracking-tight">System Intelligence Monitor</h3>
            <p class="text-[10px] text-zinc-400 font-bold tracking-[0.2em] uppercase">Real-time Inference & Lifecycle</p>
        </div>
        <div class="flex gap-2">
            <span class="px-3 py-1 bg-black text-white text-[9px] font-bold rounded-lg tracking-widest uppercase">Live Pulse</span>
        </div>
    </div>
    
    <div class="flex flex-col border-t border-zinc-100">
        <!-- Graph Canvas -->
        <div class="p-8 relative bg-white group overflow-hidden border-b border-zinc-100">
            <div style="position:relative; width:100%; height:280px;">
                <canvas id="resourceChart"></canvas>
            </div>
            <div class="absolute bottom-4 right-6">
                <span class="text-[9px] font-bold text-zinc-200 uppercase tracking-widest">D3 Neural Flux</span>
            </div>
        </div>

        <!-- Trace Stream (Console Style) -->
        <div class="w-full bg-zinc-950 overflow-hidden flex flex-col min-h-[200px] max-h-[300px]">
            <div class="p-4 bg-zinc-900 flex items-center justify-between border-b border-zinc-800">
                <div class="flex items-center gap-2">
                    <span class="w-2 h-2 bg-zinc-400 rounded-full animate-pulse"></span>
                    <span class="text-[10px] font-black text-zinc-200 uppercase tracking-tighter">Inference Stream</span>
                </div>
                <button class="text-zinc-500 hover:text-white transition-colors" title="Clear Stream">
                    <span class="material-symbols-outlined text-sm">filter_list</span>
                </button>
            </div>
            <div id="traceLogsContainer" class="flex-1 overflow-y-auto p-5 font-mono text-[11px] leading-relaxed space-y-3 text-zinc-500 scroll-smooth selection:bg-zinc-100 selection:text-black">
                <div class="flex flex-col gap-1">
                    <span class="text-zinc-700 italic">Initializing sovereign connection...</span>
                    <span class="text-zinc-300 font-bold">» System established. Listening for events.</span>
                </div>
            </div>
        </div>
    </div>
</div>
