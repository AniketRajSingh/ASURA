<!-- Skill Registry Component -->
<div id="page-skills" class="page hidden flex-col w-full gap-8">
    <!-- Header Widget -->
    <header class="flex justify-between items-center bg-white border border-zinc-200 rounded-2xl p-10 shadow-sm">
        <div>
            <h1 class="text-4xl font-black tracking-tight text-zinc-900">Skill Registry</h1>
            <p class="text-zinc-400 mt-2 text-[10px] font-bold tracking-[0.2em] uppercase">System Capabilities & Neural Extensions</p>
        </div>
        <div class="flex gap-4 items-center">
            <div class="relative">
                <select id="skill-selector" 
                        class="appearance-none bg-zinc-50 border border-zinc-200 rounded-xl pl-5 pr-12 py-3 text-sm font-medium outline-none focus:ring-2 focus:ring-zinc-100 focus:border-black transition-all w-72 cursor-pointer" 
                        onchange="loadSkillSource(this.value); loadSkillDocs(this.value)">
                    <option value="">Select a cognitive module...</option>
                </select>
                <span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-zinc-400 text-sm pointer-events-none">expand_more</span>
            </div>
            <button class="bg-black text-white px-8 py-3 rounded-xl flex items-center gap-2 hover:bg-zinc-900 transition-all font-bold text-sm shadow-xl active:scale-95" onclick="listSkills()">
                <span class="material-symbols-outlined text-lg">refresh</span>
                Refresh
            </button>
        </div>
    </header>

    <!-- Dual Panel Widget -->
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 h-[640px]">
        <!-- Documentation Panel -->
        <div class="bg-white border border-zinc-200 rounded-2xl shadow-sm flex flex-col overflow-hidden">
            <header class="px-8 py-5 bg-zinc-50/50 border-b border-zinc-100 flex items-center gap-3">
                <div class="w-8 h-8 bg-zinc-100 rounded-lg flex items-center justify-center">
                    <span class="material-symbols-outlined text-sm text-zinc-500">description</span>
                </div>
                <div>
                    <h3 class="font-black text-sm text-zinc-900 uppercase tracking-tight">Neural Documentation</h3>
                    <p class="text-[9px] font-bold text-zinc-400 uppercase tracking-widest">Capability Interface</p>
                </div>
            </header>
            <div id="skill-docs-view" class="flex-1 p-8 overflow-y-auto text-sm leading-relaxed text-zinc-600 custom-scrollbar scroll-smooth">
                <div class="flex flex-col items-center justify-center h-full text-zinc-200 gap-4">
                    <span class="material-symbols-outlined text-6xl">psychology</span>
                    <p class="text-[10px] font-black uppercase tracking-[0.3em]">Select a module to view docs</p>
                </div>
            </div>
        </div>

        <!-- Implementation Panel -->
        <div class="bg-zinc-950 border border-zinc-900 rounded-2xl shadow-2xl flex flex-col overflow-hidden">
            <header class="px-8 py-5 bg-zinc-900 border-b border-zinc-800 flex justify-between items-center">
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 bg-zinc-800 rounded-lg flex items-center justify-center">
                        <span class="material-symbols-outlined text-sm text-zinc-400">code</span>
                    </div>
                    <div>
                        <h3 class="font-black text-sm text-zinc-200 uppercase tracking-tight">Implementation</h3>
                        <p class="text-[9px] font-bold text-zinc-600 uppercase tracking-widest">Source Tree</p>
                    </div>
                </div>
                <span class="text-[9px] font-black text-zinc-700 uppercase tracking-widest bg-zinc-800 px-3 py-1 rounded-lg">READ ONLY</span>
            </header>
            <div class="flex-1 p-8 overflow-y-auto custom-scrollbar bg-zinc-950">
                <pre id="skill-source-view" class="font-mono text-xs text-zinc-500 leading-relaxed whitespace-pre-wrap"># Awaiting neural handshake...</pre>
            </div>
        </div>
    </div>
</div>
