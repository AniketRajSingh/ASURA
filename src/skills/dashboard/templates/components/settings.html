<!-- System Settings Component -->
<div id="page-settings" class="page hidden asura-section w-full">
    <!-- Header Widget -->
    <header class="flex flex-col sm:flex-row justify-between items-start sm:items-center bg-white border border-zinc-200 rounded-2xl p-6 lg:p-10 shadow-sm gap-6 asura-card">
        <div>
            <h1 class="text-3xl lg:text-4xl font-black tracking-tight text-zinc-900">System Configuration</h1>
            <p class="text-zinc-400 mt-2 text-[10px] font-bold tracking-[0.2em] uppercase">Environment Variables & Core System Parameters</p>
        </div>
        <button class="w-full sm:w-auto bg-black text-white px-8 lg:px-10 py-3.5 rounded-xl flex items-center justify-center gap-3 hover:bg-zinc-900 transition-all font-black text-sm shadow-xl active:scale-95" onclick="updateSettings()">
            <span class="material-symbols-outlined">save</span>
            SAVE CONFIG
        </button>
    </header>

    <!-- Settings Panel Widget -->
    <div class="asura-card p-0 overflow-hidden">
        <div class="px-8 py-5 bg-zinc-50 border-b border-zinc-100 flex items-center gap-3">
            <span class="material-symbols-outlined text-zinc-400">tune</span>
            <h3 class="text-sm font-black text-zinc-800 uppercase tracking-widest">Configuration Registry</h3>
        </div>
        <div id="settings-list" class="p-6 lg:p-8 grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- Dynamic settings injected here via JS -->
            <div class="col-span-full flex flex-col items-center justify-center py-16 text-zinc-200 gap-4">
                <span class="material-symbols-outlined text-5xl animate-pulse">settings</span>
                <p class="text-[10px] font-black uppercase tracking-[0.3em]">Loading Configuration...</p>
            </div>
        </div>
    </div>
</div>
