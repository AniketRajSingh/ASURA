<!-- Main Dashboard Component -->
<div id="page-dashboard" class="page hidden asura-section w-full">
    
    <!-- Hero Header -->
    <header class="flex flex-col lg:flex-row justify-between items-start lg:items-center bg-white border border-zinc-200 rounded-2xl p-6 lg:p-10 shadow-sm gap-8 asura-card">
        <div>
            <div class="flex items-center gap-4">
                <span class="w-3 h-3 bg-black rounded-full animate-pulse border-4 border-zinc-100 ring-1 ring-zinc-300"></span>
                <h1 class="text-3xl lg:text-4xl font-black tracking-tight text-zinc-900">System Sovereign</h1>
            </div>
            <p class="text-zinc-500 mt-2 lg:mt-3 font-medium text-sm lg:text-base text-balance">ASURA core operational. All cognitive pathways nominal.</p>
        </div>
        <div class="flex flex-col sm:flex-row items-stretch sm:items-center gap-4 lg:gap-6 w-full lg:w-auto">
            <!-- Node Selector -->
            <select id="node-selector" class="bg-zinc-50 border border-zinc-200 text-[10px] font-black uppercase tracking-widest px-4 py-3 lg:py-2 rounded-xl focus:outline-none focus:ring-2 focus:ring-black transition-all" onchange="switchNode()">
                <option value="local">📍 Local Node</option>
                <option value="peer_0">📡 RNDPC (Windows)</option>
            </select>

            <div id="cluster-status" class="flex items-center justify-between lg:justify-start gap-3 bg-zinc-50 border border-zinc-100 px-6 py-3 rounded-2xl flex-1 lg:flex-none">
                <div class="flex flex-col">
                    <span class="text-[9px] font-black text-zinc-400 uppercase tracking-widest">Cluster Role</span>
                    <span id="node-role" class="text-xs font-bold text-zinc-900">Determining...</span>
                </div>
                <div class="w-px h-6 bg-zinc-200 mx-2"></div>
                <div class="flex flex-col">
                    <span class="text-[9px] font-black text-zinc-400 uppercase tracking-widest">Witness</span>
                    <span id="witness-status" class="text-xs font-bold text-green-600">Active</span>
                </div>
            </div>
            <button class="bg-black text-white px-8 py-3 rounded-xl flex items-center justify-center gap-2 hover:bg-zinc-900 transition-all font-bold text-sm tracking-tight shadow-xl" onclick="runCmd('/restart')">
                <span class="material-symbols-outlined text-lg">sync</span>
                REBOOT
            </button>
        </div>
    </header>

    <!-- Modular Widget: Hero Stats -->
    {% include "widgets/hero_stats.html" %}

    <!-- Secondary Area: Ops & Intelligence -->
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
        <!-- Modular Widget: Pending Operations -->
        <div class="lg:col-span-4 sticky top-12">
            {% include "widgets/op_list.html" %}
        </div>

        <!-- Modular Widget: Intelligence Monitor -->
        <div class="lg:col-span-8">
            {% include "widgets/intel_monitor.html" %}
        </div>
    </div>
</div>
