<!-- System Evolution Component -->
<div id="page-evolution" class="page hidden flex-col w-full gap-8">
    <!-- Header Widget -->
    <header class="flex justify-between items-center bg-white border border-zinc-200 rounded-2xl p-10 shadow-sm">
        <div class="flex items-center gap-5">
            <div class="w-12 h-12 bg-zinc-950 text-white rounded-xl flex items-center justify-center">
                <span class="material-symbols-outlined text-2xl">psychology</span>
            </div>
            <div>
                <h1 class="text-4xl font-black tracking-tight text-zinc-900">System Evolution</h1>
                <p class="text-zinc-400 mt-1 text-[10px] font-bold tracking-[0.2em] uppercase">Cognitive Growth Engine</p>
            </div>
        </div>
        <button id="evolveButton" onclick="triggerEvolution()" class="bg-black text-white px-10 py-3.5 rounded-xl flex items-center gap-3 hover:bg-zinc-900 transition-all font-black text-sm shadow-2xl active:scale-95">
            <span class="material-symbols-outlined">auto_awesome</span>
            EVOLVE SYSTEM
        </button>
    </header>

    <!-- Content Grid -->
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">

        <div class="lg:col-span-8 bg-white border border-zinc-200 rounded-2xl shadow-sm flex items-center justify-center min-h-[400px] overflow-hidden relative">
            <div class="absolute inset-0 bg-gradient-to-br from-zinc-50 to-white"></div>
            <div id="evolutionOrb" class="relative z-10 flex flex-col items-center gap-6">
                <!-- Animated Rings -->
                <div class="relative flex items-center justify-center">
                    <div class="w-48 h-48 rounded-full border border-zinc-200 absolute animate-ping opacity-10"></div>
                    <div class="w-40 h-40 rounded-full border border-zinc-300 absolute animate-pulse opacity-20"></div>
                    <div class="w-32 h-32 rounded-full bg-zinc-950 flex items-center justify-center shadow-2xl z-10">
                        <span class="material-symbols-outlined text-white" style="font-size: 52px">psychology</span>
                    </div>
                </div>
                <div class="text-center">
                    <p class="text-xs font-black text-zinc-400 uppercase tracking-[0.3em]">Neural Core</p>
                    <p class="text-sm font-black text-zinc-900 mt-1">Sovereign Intelligence v4.0</p>
                </div>
            </div>
        </div>

        <!-- Stats Column -->
        <div class="lg:col-span-4 flex flex-col gap-6">
            <!-- Cognitive Loops Widget -->
            <div class="bg-white border border-zinc-200 rounded-2xl p-8 shadow-sm flex flex-col gap-4 hover:shadow-md transition-all">
                <div class="flex items-center gap-3">
                    <span class="material-symbols-outlined text-zinc-400">dataset</span>
                    <span class="text-[10px] font-black uppercase tracking-widest text-zinc-400">Cognitive Loops</span>
                </div>
                <div class="text-3xl font-black text-zinc-900">Baseline</div>
                <div class="flex items-center gap-2 text-[10px] font-black text-zinc-400 border-t border-zinc-100 pt-4">
                    <span class="material-symbols-outlined text-sm">trending_up</span>
                    Loop State: Active
                </div>
            </div>
            
            <!-- Capabilities Widget -->
            <div class="bg-white border border-zinc-200 rounded-2xl p-8 shadow-sm flex flex-col gap-4 hover:shadow-md transition-all">
                <div class="flex items-center gap-3">
                    <span class="material-symbols-outlined text-zinc-400">extension</span>
                    <span class="text-[10px] font-black uppercase tracking-widest text-zinc-400">Capabilities</span>
                </div>
                <div class="text-3xl font-black text-zinc-900"><span id="skillsCount">0</span> <span class="text-lg text-zinc-400">modules</span></div>
                <div class="flex items-center gap-2 text-[10px] font-black text-zinc-400 border-t border-zinc-100 pt-4">
                    <span class="material-symbols-outlined text-sm">memory</span>
                    Hot-loaded & Ready
                </div>
            </div>

            <!-- System State Widget -->
            <div class="bg-zinc-950 rounded-2xl p-8 shadow-2xl flex flex-col gap-4">
                <div class="flex items-center gap-3">
                    <span class="material-symbols-outlined text-zinc-500">upgrade</span>
                    <span class="text-[10px] font-black uppercase tracking-widest text-zinc-500">System State</span>
                </div>
                <div class="text-3xl font-black text-white">NOMINAL</div>
                <div class="flex items-center gap-2 text-[10px] font-black text-zinc-500 border-t border-zinc-900 pt-4">
                    <span class="w-2 h-2 bg-white rounded-full animate-pulse"></span>
                    Kernel Integrity: Stable
                </div>
            </div>
        </div>
    </div>
</div>
