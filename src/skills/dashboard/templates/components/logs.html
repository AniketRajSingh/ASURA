<!-- Audit Logs Component -->
<div id="page-logs" class="page hidden flex-col w-full gap-8">
    <!-- Header Widget -->
    <header class="flex justify-between items-center bg-white border border-zinc-200 rounded-2xl p-10 shadow-sm">
        <div>
            <h1 class="text-4xl font-black tracking-tight text-zinc-900">Audit Log</h1>
            <p class="text-zinc-400 mt-2 text-[10px] font-bold tracking-[0.2em] uppercase">Live System Event Stream — Newest First</p>
        </div>
        <span class="flex items-center gap-2 bg-zinc-50 border border-zinc-200 rounded-xl px-6 py-3">
            <span class="w-2 h-2 bg-zinc-400 rounded-full animate-pulse"></span>
            <span class="text-[10px] font-black text-zinc-500 uppercase tracking-widest">Streaming</span>
        </span>
    </header>

    <!-- Log Stream Widget -->
    <div class="bg-zinc-950 rounded-2xl border border-zinc-900 shadow-2xl flex flex-col overflow-hidden">
        <div class="px-8 py-5 bg-zinc-900 border-b border-zinc-800 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <span class="material-symbols-outlined text-sm text-zinc-400">list_alt</span>
                <h3 class="text-sm font-black text-zinc-300 uppercase tracking-widest">System Events</h3>
            </div>
            <div class="flex gap-2">
                <div class="w-2.5 h-2.5 rounded-full bg-zinc-800"></div>
                <div class="w-2.5 h-2.5 rounded-full bg-zinc-800"></div>
                <div class="w-2.5 h-2.5 rounded-full bg-zinc-600 animate-pulse"></div>
            </div>
        </div>
        <div id="security-audit-trail-full" class="p-8 font-mono text-xs text-zinc-500 space-y-2 max-h-[680px] overflow-y-auto custom-scrollbar leading-relaxed">
            {{ log_entries }}
        </div>
    </div>
</div>
